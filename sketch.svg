<svg width="100%" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Ақылды үй және автотұрақ макетінің эскизі</title>
<desc>Сол жақта LED және LDR датчигі бар үй, ортада Arduino Uno, оң жақта RFID считыватель, шлагбаум және автомобиль бар автотұрақ учаскесі.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#9aa5c0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="460" fill="#0b1220"/>

<line x1="40" y1="380" x2="640" y2="380" stroke="#2a3652" stroke-width="1"/>

<!-- ===== HOUSE (left) ===== -->
<rect x="70" y="260" width="140" height="120" fill="none" stroke="#3b82f6" stroke-width="1.5" rx="2"/>
<polygon points="60,260 140,200 220,260" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="170" y="320" width="30" height="60" fill="none" stroke="#9aa5c0" stroke-width="1"/>
<rect x="90" y="290" width="36" height="36" fill="none" stroke="#9aa5c0" stroke-width="1"/>
<circle cx="108" cy="308" r="7" fill="#1a2a1a" stroke="#f0b429" stroke-width="1"/>
<text x="108" y="309" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#f0b429" font-family="sans-serif">LED</text>
<circle cx="140" cy="225" r="9" fill="#0d2430" stroke="#22d3ee" stroke-width="1"/>
<text x="140" y="226" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#22d3ee" font-family="sans-serif">LDR</text>
<line x1="140" y1="234" x2="140" y2="255" stroke="#22d3ee" stroke-width="0.5" stroke-dasharray="3 2"/>

<text x="140" y="405" text-anchor="middle" font-size="14" fill="#e8ecf7" font-family="sans-serif" font-weight="500">Ақылды үй</text>

<!-- ===== ARDUINO (center) ===== -->
<rect x="300" y="300" width="100" height="70" rx="8" fill="#1a1530" stroke="#7f77dd" stroke-width="1"/>
<text x="350" y="328" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#cecbf6" font-family="sans-serif" font-weight="500">Arduino</text>
<text x="350" y="346" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#afa9ec" font-family="sans-serif">Uno</text>
<text x="350" y="405" text-anchor="middle" font-size="14" fill="#e8ecf7" font-family="sans-serif" font-weight="500">Басқару блогы</text>

<path d="M210 320 L300 320" fill="none" stroke="#9aa5c0" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M400 320 L470 320" fill="none" stroke="#9aa5c0" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ===== PARKING (right) ===== -->
<rect x="470" y="355" width="150" height="25" fill="none" stroke="#5f5e5a" stroke-width="1"/>

<rect x="495" y="330" width="10" height="50" fill="none" stroke="#9aa5c0" stroke-width="1"/>
<line x1="500" y1="332" x2="555" y2="310" stroke="#9aa5c0" stroke-width="3" stroke-linecap="round"/>

<rect x="460" y="300" width="14" height="40" fill="none" stroke="#f0997b" stroke-width="1"/>
<rect x="452" y="288" width="30" height="16" rx="3" fill="#2a160e" stroke="#f0997b" stroke-width="1"/>
<text x="467" y="296" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#f0997b" font-family="sans-serif">RFID</text>

<rect x="540" y="340" width="70" height="26" rx="6" fill="#0c2a4a" stroke="#378ADD" stroke-width="1"/>
<circle cx="555" cy="368" r="7" fill="none" stroke="#9aa5c0" stroke-width="1"/>
<circle cx="595" cy="368" r="7" fill="none" stroke="#9aa5c0" stroke-width="1"/>
<text x="575" y="355" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#dce8f7" font-family="sans-serif">авто</text>

<text x="545" y="405" text-anchor="middle" font-size="14" fill="#e8ecf7" font-family="sans-serif" font-weight="500">Автотұрақ</text>

<!-- Legend -->
<circle cx="90" cy="440" r="5" fill="#f0b429"/>
<text x="102" y="441" dominant-baseline="central" font-size="12" fill="#9aa5c0" font-family="sans-serif">Жарық (LED)</text>
<circle cx="250" cy="440" r="5" fill="#22d3ee"/>
<text x="262" y="441" dominant-baseline="central" font-size="12" fill="#9aa5c0" font-family="sans-serif">Датчик (LDR)</text>
<circle cx="400" cy="440" r="5" fill="#f0997b"/>
<text x="412" y="441" dominant-baseline="central" font-size="12" fill="#9aa5c0" font-family="sans-serif">RFID считыватель</text>
<circle cx="580" cy="440" r="5" fill="#7f77dd"/>
<text x="592" y="441" dominant-baseline="central" font-size="12" fill="#9aa5c0" font-family="sans-serif">Басқару</text>
</svg>
